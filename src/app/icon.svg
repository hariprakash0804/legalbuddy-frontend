<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    
    <!-- Gold Scales Gradient -->
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Indigo Accent Gradient -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    
    <!-- Subtle Inner Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded Squircle Background -->
  <rect x="16" y="16" width="480" height="480" rx="110" fill="url(#bg-grad)" stroke="#6366f1" stroke-width="8" stroke-opacity="0.4" />
  
  <!-- Outer Decorative Ring -->
  <circle cx="256" cy="256" r="215" fill="none" stroke="url(#accent-grad)" stroke-width="4" stroke-dasharray="12 8" opacity="0.4" />

  <!-- Scales of Justice Group -->
  <g transform="translate(0, 10)">
    <!-- Central Pillar / Pillar Base -->
    <path d="M 236 400 L 276 400 L 270 380 L 242 380 Z" fill="url(#gold-grad)" />
    <rect x="250" y="150" width="12" height="235" rx="6" fill="url(#gold-grad)" />
    <!-- Pillar Base Decorative Ring -->
    <rect x="240" y="365" width="32" height="12" rx="4" fill="url(#gold-grad)" />
    
    <!-- Top Finial / Ornament -->
    <circle cx="256" cy="140" r="16" fill="url(#gold-grad)" />

    <!-- Main Crossbar (Balance Beam) -->
    <path d="M 120 185 Q 256 165 392 185" fill="none" stroke="url(#gold-grad)" stroke-width="14" stroke-linecap="round" />
    <circle cx="120" cy="185" r="9" fill="url(#gold-grad)" />
    <circle cx="392" cy="185" r="9" fill="url(#gold-grad)" />

    <!-- Left Scale Strings -->
    <line x1="120" y1="185" x2="80" y2="280" stroke="#fef08a" stroke-width="4" opacity="0.85" />
    <line x1="120" y1="185" x2="160" y2="280" stroke="#fef08a" stroke-width="4" opacity="0.85" />

    <!-- Left Scale Bowl -->
    <path d="M 65 280 C 65 330, 175 330, 175 280 Z" fill="url(#gold-grad)" />
    <ellipse cx="120" cy="280" rx="55" ry="10" fill="#fef08a" opacity="0.6" />

    <!-- Right Scale Strings -->
    <line x1="392" y1="185" x2="352" y2="280" stroke="#fef08a" stroke-width="4" opacity="0.85" />
    <line x1="392" y1="185" x2="432" y2="280" stroke="#fef08a" stroke-width="4" opacity="0.85" />

    <!-- Right Scale Bowl -->
    <path d="M 337 280 C 337 330, 447 330, 447 280 Z" fill="url(#gold-grad)" />
    <ellipse cx="392" cy="280" rx="55" ry="10" fill="#fef08a" opacity="0.6" />
  </g>

  <!-- AI Sparkle Elements -->
  <!-- Top Right Sparkle -->
  <path d="M 380 90 Q 380 115 405 115 Q 380 115 380 140 Q 380 115 355 115 Q 380 115 380 90 Z" fill="#67e8f9" filter="url(#glow)" />
  <circle cx="380" cy="115" r="4" fill="#ffffff" />
  
  <!-- Small Sparkle Left -->
  <path d="M 130 100 Q 130 112 142 112 Q 130 112 130 124 Q 130 112 118 112 Q 130 112 130 100 Z" fill="#a5b4fc" opacity="0.8" />

  <!-- Bottom Accent Light -->
  <ellipse cx="256" cy="450" rx="120" ry="12" fill="url(#accent-grad)" opacity="0.5" filter="url(#glow)" />
</svg>
